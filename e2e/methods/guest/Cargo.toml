[package]
name = "hello"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ['std'] }
# Stock crates.io sha2 (exact pin), deliberately NOT the risc0-accelerated
# fork: the `hash` guest measures real rv32im execution of a real dependency.
sha2 = { version = "=0.10.9", default-features = false }
# Stock crates.io k256 (exact pin), again NOT a risc0 precompile fork: the
# `ecdsa` guest measures real rv32im secp256k1 verification.
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa", "alloc"] }
